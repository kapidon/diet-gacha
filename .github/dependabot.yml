version: 2

updates:
  # npm の依存。関連パッケージをまとめ、片方だけの更新による不整合を避ける。
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Node 本体は24系。型だけを新しいメジャーへ上げない。本体を上げるときに見直す。
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      prisma:
        patterns: [prisma, '@prisma/*']
      next-react:
        patterns: [next, eslint-config-next, react, react-dom, '@types/react', '@types/react-dom']
      better-auth:
        patterns: [better-auth, auth]

  # ワークフローが固定している actions/* のバージョンも古くなる。
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
