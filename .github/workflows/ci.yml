name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # tests/db/ は実 DB を使う。compose.yaml と同じ postgres:18 に揃える。
    # ポートは 5433 ではなく 5432。ホストの PostgreSQL と衝突しないランナー上では
    # ずらす理由がなく、DATABASE_URL 側で吸収できる。
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: diet_gacha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d diet_gacha_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      # CI に .env は無い。prisma.config.ts と vitest.config.mts は
      # .env が無ければ実環境変数を見るので、ここで渡せば足りる。
      # postinstall の prisma generate もこの値を要求する（無いと npm ci が失敗する）。
      # tests/db/helpers.ts の assertTestDatabase が localhost と diet_gacha_test を要求するため、
      # ホスト名と DB 名は変えられない。
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/diet_gacha_test
      # next build は NODE_ENV=production で走り、値が空だと better-auth が起動時に落ちる。
      # CI 専用の使い捨ての値で、秘密ではない。
      BETTER_AUTH_SECRET: ci-only-dummy-secret-not-used-anywhere-else

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      # Takumi Guard の npm レジストリプロキシ経由で解決する（GMO Flatt Security）。
      # npm audit と Dependabot が「既知の脆弱性」を見るのに対し、
      # こちらは悪意あるパッケージそのもの（typosquatting、乗っ取り）を install 前に止める。
      # bot-id を渡さない匿名モードなので、認証もシークレットも要らない。
      # package-lock.json の resolved も npm.flatt.tech を指している必要がある
      # （npm ci は lock の resolved をそのまま使うため）。リポジトリの .npmrc と対になっている。
      - uses: flatt-security/setup-takumi-guard-npm@14f07d0cbc739b42a1b7c70a04c2b84cd1318ddd # v1.4.0

      - run: npm ci

      # migrate dev は非対話環境で失敗する。deploy はプロンプトを出さない。
      - run: npx prisma migrate deploy

      - run: npm run lint
      - run: npm run build
      - run: npm test

  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # 2026-11-14 の依存更新で high / critical は解消したため、high 以上を止める。
      # 開発依存も監査する。残る moderate の経路と判断は docs/maintenance/ に記録する。
      - run: npm audit --audit-level=high
